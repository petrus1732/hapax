name: Deploy static Word Blitz practice app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Configure pnpm build-script approvals for CI
        run: |
          cat > pnpm-workspace.yaml <<'EOF'
          allowBuilds:
            esbuild: true
            bufferutil: false
            utf-8-validate: false
          EOF

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Force static GitHub Pages Next config
        run: |
          cat > next.config.mjs <<'EOF'
          /** @type {import('next').NextConfig} */
          const isGithubActions = process.env.GITHUB_ACTIONS === 'true';
          const repoName = process.env.GITHUB_REPOSITORY?.split('/')[1] ?? 'hapax';

          const nextConfig = {
            output: 'export',
            trailingSlash: true,
            images: {
              unoptimized: true,
            },
            basePath: isGithubActions ? `/${repoName}` : '',
            assetPrefix: isGithubActions ? `/${repoName}/` : '',
          };

          export default nextConfig;
          EOF

      - name: Patch app for static GitHub Pages export
        run: |
          rm -rf app/api
          rm -rf app/boards
          rm -rf app/create
          rm -rf app/login
          rm -rf app/register
          rm -rf app/dictionary
          rm -f middleware.ts
          rm -f app/lib/actions.ts
          rm -f app/lib/dictionary.ts
          rm -f app/lib/getTrie.ts
          rm -f app/ui/top-bar.tsx
          rm -f app/ui/login-form.tsx
          rm -f app/ui/register-form.tsx

          cat > app/layout.tsx <<'EOF'
          import type { Metadata } from 'next';
          import './ui/colors.css';
          import './ui/globals.css';

          export const metadata: Metadata = {
            title: 'HaPaX Word Blitz Practice Lab',
            description: 'Word Blitz practice boards with events, arena rules, and rare-letter training modes.',
          };

          export default function RootLayout({
            children,
          }: Readonly<{
            children: React.ReactNode;
          }>) {
            return (
              <html lang="en" suppressHydrationWarning>
                <body className="font-sans">
                  {children}
                </body>
              </html>
            );
          }
          EOF

          cat > app/page.tsx <<'EOF'
          import Link from 'next/link';

          export default function Home() {
            return (
              <main className="flex min-h-dvh flex-col items-center justify-center bg-slate-50 p-8 text-slate-950 dark:bg-neutral-950 dark:text-neutral-50">
                <div className="grid w-full max-w-sm gap-4 text-center">
                  <Link
                    href="/random-board"
                    className="flex min-h-20 grow flex-col items-center justify-center gap-1 rounded-2xl border border-blue-200 bg-blue-50 p-4 text-xl font-black text-blue-700 hover:bg-blue-100 dark:border-blue-900 dark:bg-blue-950 dark:text-blue-100"
                  >
                    Word Blitz Practice Lab
                    <span className="text-sm font-medium opacity-75">
                      practice, events, arena, and training modes
                    </span>
                  </Link>
                </div>
              </main>
            );
          }
          EOF

          python <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path("app/random-board/random-board-client.tsx")
          text = path.read_text()

          replacement = """  const getWordlist = async () => {
            const response = await fetch('../CSW2019.txt');
            if (!response.ok) throw new Error('Failed to get wordlist');
            const text = await response.text();
            return {
              message: text
                .split(String.fromCharCode(10))
                .map((word) => word.trim())
                .filter(Boolean),
            };
          };

          useEffect"""

          if "CSW2019.txt" in text:
            print("getWordlist already uses static CSW2019.txt.")
          else:
            pattern = r"  const getWordlist = async \(\) => \{.*?\n  \};\n\n  useEffect"
            patched, count = re.subn(pattern, replacement, text, count=1, flags=re.S)

            if count != 1:
              print("Could not patch getWordlist. Showing nearby context:", file=sys.stderr)
              marker = "getWordlist"
              idx = text.find(marker)
              if idx >= 0:
                print(text[max(0, idx - 400):idx + 1200], file=sys.stderr)
              else:
                print("No getWordlist marker found.", file=sys.stderr)
              sys.exit(1)

            path.write_text(patched)
            print("Patched getWordlist to load public/CSW2019.txt.")
          PY

      - name: Show remaining server-action markers
        run: |
          grep -R "use server\|action={async\|action={formAction}" -n app \
            --include="*.ts" \
            --include="*.tsx" || true

      - name: Build static site
        run: pnpm build

      - name: Add .nojekyll
        run: touch out/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
